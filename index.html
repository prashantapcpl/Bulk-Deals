html,body{margin:0;padding:0;background:#E5EAEF}

@media(max-width:560px){.row>*{flex:1 1 100%}.big{flex-direction:column}}

<script type="text/plain" id="app-source">
const { useState, useEffect, useMemo, Fragment } = React;
const BUILD = "b4";   /* shown on the sign-in screen and in settings */

/* ================= names, products, ports ================= */
const LEGAL = ["pvt","private","ltd","limited","llp","co","company","inc","corp","the"];
const GENERIC = ["chemicals","chemical","chem","chemsol","organics","organic","solvents","solvent","exports","export",
 "imports","impex","overseas","industries","industry","enterprises","enterprise","trade","trading","traders","petrochem",
 "petrochemicals","polymers","agencies","agency","corporation","marketing","international","india","group","sales","products"];
const stripParen = (s) => String(s||"").replace(/\([^)]*\)/g," ");
const words = (s) => stripParen(s).replace(/[^\p{L}\p{N} ]/gu," ").split(/\s+/).filter(Boolean);
const normCo = (s) => words(s).map(w=>w.toLowerCase()).filter(w=>!LEGAL.includes(w)).join(" ");
function shortName(full){
  const ws = words(full).filter(w=>!LEGAL.includes(w.toLowerCase()));
  if(!ws.length) return String(full||"—").slice(0,12);
  const cut=[];
  for(const w of ws){ if(GENERIC.includes(w.toLowerCase()) && cut.length) break; cut.push(w); if(cut.length>=3) break; }
  const keep = cut.length?cut:[ws[0]];
  const title=(w)=> w.length<=2 ? w.toUpperCase() : w[0].toUpperCase()+w.slice(1);
  return keep.every(w=>w.length===1) ? keep.join("").toUpperCase() : keep.map(title).join(" ");
}
const prodKey = (s) => stripParen(s).toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
const PRODUCTS = [
 {code:"Methanol",alias:["methanol","meoh"]},
 {code:"PG",alias:["mono propylene glycol","propylene glycol","mpg","pg"]},
 {code:"Styrene",alias:["styrene monomer","styrene","sm"]},
 {code:"Toluene",alias:["toluene","tol"]},
 {code:"NBA",alias:["normal butanol","n butanol","n-butanol","butanol","nba","nbol"]},
 {code:"BA",alias:["normal butyl acetate","n butyl acetate","butyl acetate","nbac","ba"]},
 {code:"Cyclo",alias:["cyclohexanone","cyclo","chn"]},
 {code:"Phenol",alias:["phenol"]},
 {code:"Xylene",alias:["mixed xylene","mix xylene","xylene","mx"]},
 {code:"MEK",alias:["methyl ethyl ketone","mek"]},
 {code:"MIBK",alias:["methyl isobutyl ketone","mibk"]},
 {code:"Acetone",alias:["acetone"]},
 {code:"IPA",alias:["iso propyl alcohol","isopropyl alcohol","ipa"]},
 {code:"MEG",alias:["mono ethylene glycol","meg"]},
 {code:"DEG",alias:["di ethylene glycol","deg"]},
 {code:"EA",alias:["ethyl acetate","etac"]},
 {code:"MDC",alias:["methylene dichloride","mdc"]},
 {code:"Glycerine",alias:["glycerine","glycerin"]},
 {code:"Hexane",alias:["hexane"]},{code:"SBP",alias:["sbp"]},{code:"THF",alias:["thf"]},
 {code:"DMF",alias:["dmf"]},{code:"NMP",alias:["nmp"]},
];
let EXTRA_PRODUCTS = [];                 /* short forms added in settings */
let ALIASES = [];
let PRODUCT_CODES = [];
function rebuildProducts(){
  const all=[...EXTRA_PRODUCTS,...PRODUCTS];
  const seen=new Set(); const codes=[];
  all.forEach(p=>{ if(!seen.has(p.code)){ seen.add(p.code); codes.push(p.code); } });
  PRODUCT_CODES=codes;
  ALIASES=all.flatMap(p=>(p.alias||[]).map(a=>({a:String(a).toLowerCase().trim(),code:p.code})))
    .filter(x=>x.a).sort((x,y)=>y.a.length-x.a.length);
}
const setExtraProducts=(list)=>{ EXTRA_PRODUCTS=Array.isArray(list)?list:[]; rebuildProducts(); };
rebuildProducts();
function canonProduct(s){
  const t = prodKey(s); if(!t) return "";
  for(const {a,code} of ALIASES){
    if(t===a || new RegExp("(^| )"+a.replace(/[-/\\^$*+?.()|[\]{}]/g,"\\$&")+"( |$)").test(t)) return code;
  }
  return String(s||"").trim();
}
const sameProduct = (a,b) => { const x=canonProduct(a).toLowerCase(), y=canonProduct(b).toLowerCase(); return !!x&&!!y&&x===y; };
const PORTS = ["Kandla","Mundra","Hazira","Dahej","JNPT"];
function canonPort(s){
  const t=String(s||"").toLowerCase();
  if(/kandla/.test(t)) return "Kandla";
  if(/mundra/.test(t)) return "Mundra";
  if(/hazira|surat/.test(t)) return "Hazira";
  if(/dahej/.test(t)) return "Dahej";
  if(/jnpt|nhava|sheva|mumbai|bombay/.test(t)) return "JNPT";
  return "";
}
const portKey = (s) => canonPort(s).toLowerCase() || String(s||"").toLowerCase().replace(/[^a-z0-9]+/g,"");

/* ================= numbers ================= */
const DEV={"०":"0","१":"1","२":"2","३":"3","४":"4","५":"5","६":"6","७":"7","८":"8","९":"9"};
const deDev = (s) => String(s||"").replace(/[०-९]/g,(d)=>DEV[d]);
const UNITS={zero:0,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12,
 thirteen:13,fourteen:14,fifteen:15,sixteen:16,seventeen:17,eighteen:18,nineteen:19,twenty:20,thirty:30,forty:40,
 fourty:40,fifty:50,sixty:60,seventy:70,eighty:80,ninety:90,ek:1,do:2,teen:3,char:4,paanch:5,panch:5,chhe:6,saat:7,
 aath:8,nau:9,das:10,bees:20,tees:30,chalis:40,pachas:50,saath:60,sattar:70,assi:80,nabbe:90};
const SCALES={hundred:100,sau:100,thousand:1000,hazar:1000,hajar:1000,lakh:100000,lac:100000};
function wordsToNumber(text){
  const toks=String(text).toLowerCase().split(/[\s-]+/).filter(Boolean);
  let total=0,cur=0,seen=false;
  for(const t of toks){
    if(t==="and"||t==="aur") continue;
    if(UNITS[t]!==undefined){cur+=UNITS[t];seen=true;}
    else if(SCALES[t]){seen=true; if(SCALES[t]===100) cur=(cur||1)*100; else {total+=(cur||1)*SCALES[t];cur=0;}}
    else if(seen) break;
  }
  return seen? total+cur : null;
}
function digitiseWords(text){
  const isNum=(t)=>UNITS[t]!==undefined||SCALES[t]!==undefined||t==="and";
  const toks=deDev(text).split(/(\s+)/); const out=[]; let run=[];
  const flush=()=>{ if(!run.length) return; const v=wordsToNumber(run.join(" ")); out.push(v===null?run.join(" "):String(v)); run=[]; };
  toks.forEach(t=>{ const w=t.trim().toLowerCase().replace(/[.,]/g,"");
    if(!t.trim()){ if(!run.length) out.push(t); return; }
    if(isNum(w)) run.push(w); else { flush(); out.push(t); } });
  flush(); return out.join(" ").replace(/\s+/g," ").trim();
}
const num=(s)=>{const m=String(s).replace(/,/g,"").match(/-?\d+(?:\.\d+)?/); return m?+m[0]:0;};
const n2=(v)=>(Math.round((+v+Number.EPSILON)*100)/100).toLocaleString("en-IN");
const money=(v)=>{const a=Math.abs(v),s=v<0?"−":"";
  if(a>=10000000) return s+"₹"+(a/10000000).toFixed(2)+" Cr";
  if(a>=100000) return s+"₹"+(a/100000).toFixed(2)+" L";
  return s+"₹"+Math.round(a).toLocaleString("en-IN");};
const today=()=>new Date().toISOString().slice(0,10);
const dmy=(iso)=>{const p=String(iso).split("-"); return p.length===3?p[2]+"/"+p[1]+"/"+p[0].slice(2):iso;};
const uid=()=>"d_"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);

/* ================= parsing ================= */
function field(block,label){
  const re=new RegExp("^[\\s>*+-]*"+label+"[^:\\n]{0,24}?:\\s*(.+)$","im");
  const m=block.match(re); return m? m[1].trim().replace(/\s+/g," ").replace(/[.,;]+$/,"") : "";
}
function grabDate(block){
  const m=block.match(/dt\.?\s*:?\s*(\d{1,2})[/\-.](\d{1,2})[/\-.](\d{2,4})/i)||block.match(/(\d{1,2})[/\-.](\d{1,2})[/\-.](\d{2,4})/);
  if(!m) return today();
  let y=+m[3]; if(y<100) y+=2000;
  return y+"-"+String(+m[2]).padStart(2,"0")+"-"+String(+m[1]).padStart(2,"0");
}
function grabQty(s){
  const t=deDev(String(s||"")).replace(/,/g,"");
  const r=t.match(/(\d+(?:\.\d+)?)\s*(?:to|-|–|—|~)\s*(\d+(?:\.\d+)?)/i);
  if(r) return {min:+r[1],max:+r[2]};
  const one=t.match(/(\d+(?:\.\d+)?)/); return one?{min:+one[1],max:+one[1]}:{min:0,max:0};
}
const grabRate=(s)=>num(deDev(String(s||"")).replace(/gst/gi,""));
function parseStructured(text, companies){
  const blocks=String(text).split(/(?=sales\s*&?\s*purchase\s*confirmation)/i).filter(b=>/seller\s*:/i.test(b)||/buyer\s*:/i.test(b));
  if(!blocks.length) return null;
  const ours=(n)=>(companies.find(c=>normCo(c.name)===normCo(n))||{}).code||"";
  return blocks.map(b=>{
    const seller=field(b,"seller"), buyer=field(b,"buyer");
    const q=grabQty(field(b,"qty")||field(b,"quantity"));
    return { raw:b, seller, buyer, ourAsSeller:ours(seller), ourAsBuyer:ours(buyer), date:grabDate(b),
      product:field(b,"product")||field(b,"material"), qty:q.max, qtyMin:q.min, qtyMax:q.max,
      rate:grabRate(field(b,"rate")||field(b,"price")), port:field(b,"port"), storage:field(b,"storage"),
      payment:field(b,"payment"), broker:field(b,"broker"),
      comments:field(b,"comments")||field(b,"remark")||field(b,"delivery") };
  });
}
function parseLoose(text){
  const t=digitiseWords(text).replace(/\s+/g," ").trim(); if(!t) return null;
  const low=t.toLowerCase();
  let product="",at=-1;
  for(const {a,code} of ALIASES){
    const i=a.length<=3 ? low.search(new RegExp("(^|[^a-z])"+a+"([^a-z]|$)")) : low.indexOf(a);
    if(i>=0){product=code;at=i;break;}
  }
  let party = at>0 ? t.slice(0,at) : "";
  const rel=t.match(/\b(?:to|from|party|for)\s+([A-Za-z][A-Za-z .&-]{2,32})/i);
  if(!party && rel) party=rel[1];
  party=party.replace(/\b(sold|bought|sell|buy|deal|from|to|party|for)\b/gi,"").replace(/[,:;-]+/g," ").trim();
  const qm=low.match(/(\d+(?:\.\d+)?)\s*(?:to|-|–)\s*(\d+(?:\.\d+)?)\s*(?:mt|ton|tons|tonnes?|t\b)/)||
           low.match(/(\d+(?:\.\d+)?)\s*(mt|ton|tons|tonnes?|kl|t)\b/);
  let qty=0,qtyMin=0,qtyMax=0;
  if(qm && qm.length>2 && !isNaN(+qm[2])){qtyMin=+qm[1];qtyMax=+qm[2];qty=qtyMax;}
  else if(qm){qty=qtyMin=qtyMax=+qm[1];}
  const rm=low.match(/(?:rate|price|@|rs\.?|₹|per kg|par kg|bhav)\s*:?\s*(\d+(?:\.\d+)?)/)||
           low.match(/(\d+(?:\.\d+)?)\s*(?:\+\s*gst|rs\b|₹)/);
  const sm=t.match(/storage\s*:?\s*([^,.;]+)/i);
  const pay=t.match(/(\d+\s*days?\s*(?:pdc|credit)[^,.;]{0,40})/i)
    || t.match(/((?:pdc|credit)[^,.;]{0,12}?\d+\s*days?[^,.;]{0,30})/i)
    || t.match(/\b(advance|cash|rtgs)\b/i);
  /* the note is flattened to one line, so stop before the next label runs on */
  const cutAt=(v)=>String(v||"").split(/\b(?:broker|note|vessel|seller terms|thank)\b/i)[0].trim();
  const bk=t.match(/broker\s*:?\s*([^,.;\n]+)/i);
  return { date:today(), party, product, qty, qtyMin, qtyMax, rate: rm?+rm[1]:0, port:canonPort(t),
    storage: cutAt(sm?sm[1]:""), payment: cutAt(pay?pay[1]:""), broker: cutAt(bk?bk[1]:""), comments:"" };
}

/* ================= derived ================= */
function batches(deals){
  const drawn={};
  deals.forEach(d=> d.side==="sell" && (d.allocations||[]).forEach(a=>{ drawn[a.batchId]=(drawn[a.batchId]||0)+(+a.qty||0); }));
  const seq={};
  return deals.filter(d=>d.side==="buy")
    .sort((a,b)=> a.date<b.date?-1 : a.date>b.date?1 : (a.createdAt||"")<(b.createdAt||"")?-1:1)
    .map(d=>{ const c=d.code||"AO"; seq[c]=(seq[c]||0)+1;
      return {...d, code:c, batchNo: d.batchNo||c+"-"+String(seq[c]).padStart(2,"0"),
        sold: drawn[d.id]||0, balance:+(((+d.qty||0)-(drawn[d.id]||0)).toFixed(3))}; });
}
const salesOf=(deals,batchId)=> deals.filter(d=>d.side==="sell"&&(d.allocations||[]).some(a=>a.batchId===batchId))
  .map(d=>({...d, part:(d.allocations||[]).filter(a=>a.batchId===batchId).reduce((s,a)=>s+(+a.qty||0),0)}))
  .sort((a,b)=> a.date<b.date?-1:1);
const allocTotal=(d)=>(d.allocations||[]).reduce((s,a)=>s+(+a.qty||0),0);
function nextBatchNo(deals,code){
  const nums=batches(deals).filter(d=>d.code===code).map(d=>+String(d.batchNo||"").split("-")[1]||0);
  return code+"-"+String(Math.max(0,...nums)+1).padStart(2,"0");
}
function findDuplicate(deals,d){
  const q=+d.qty||0,r=+d.rate||0; if(!q||!r||!d.product) return null;
  return deals.find(x=> x.side===d.side && x.id!==d.id && x.date===d.date && sameProduct(x.product,d.product)
    && Math.abs((+x.qty||0)-q)<0.001 && Math.abs((+x.rate||0)-r)<0.001) || null;
}

/* ================= tiny bits ================= */
const F=({label,value,onChange,missing,ph,type})=>(
  <label className={missing?"miss":""}>
    <span>{label}{missing?" · needed":""}</span>
    <input type={type||"text"} value={value} placeholder={ph||""} onChange={(e)=>onChange(e.target.value)} />
  </label>);
async function hash(s){
  const b=await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
  return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,"0")).join("");
}

  /* ---------------- main ---------------- */

  const normalise=(r)=>({ side, code:r.code||code, date:r.date||today(), party:r.party||"",

      await putDeal(d); flash("Batch "+d.batchNo+" opened — "+n2(d.qty)+" t "+d.product+".");

  const commitSell=async()=>{

  /* each book belongs to one broker — flag a deal pasted into the wrong book */
  const brokerList=(book?.brokers||[]).map(x=>normCo(x)).filter(Boolean);
  const brokerMismatch=(d)=>{

    const t=normCo(d?.broker||""); if(!t) return "";  // nothing written on the paste

  };

  /* everything worth stopping the person for, gathered in one place */
  const entryFlags=(d)=>{
    const out=[]; if(!d||!book) return out;
    const wrongBk=brokerMismatch(d);
    if(wrongBk) out.push({t:"Wrong book",m:"This confirmation names "+wrongBk+" as broker, but "+book.name+" is "
      +(book.brokers||[]).join(" / ")+". It probably belongs in another book."});
    const dupe=findDuplicate(deals,d);
    if(dupe) out.push({t:"Possible duplicate",m:(dupe.batchNo?dupe.batchNo+" · ":"")+shortName(dupe.party)+" — "
      +dmy(dupe.date)+", "+n2(dupe.qty)+" t "+dupe.product+" @ ₹"+n2(dupe.rate)+"/kg, entered by "+(dupe.enteredBy||"—")+"."});
    if(d.side==="sell" && d.product && +d.qty){
      const mine=bts.filter(b=>b.code===d.code&&b.balance>0.0001);
      const match=mine.filter(b=>sameProduct(b.product,d.product));
      if(!match.length) out.push({t:"No stock of this product",
        m:"There is no open batch of "+canonProduct(d.product)+" in the "+d.code+" book. Enter the purchase first, or check the product."});
      else {
        const avail=match.reduce((t,b)=>t+b.balance,0);
        if(+d.qty>avail+0.001) out.push({t:"More than we hold",
          m:"Selling "+n2(d.qty)+" t but only "+n2(avail)+" t of "+canonProduct(d.product)+" is left in the "+d.code+" book."});
        if(d.port && !match.some(b=>portKey(b.port)===portKey(d.port))) out.push({t:"Different port",
          m:"No "+canonProduct(d.product)+" is lying at "+(canonPort(d.port)||d.port)+". The open batches are at "
            +[...new Set(match.map(b=>canonPort(b.port)||b.port))].join(", ")+"."});
      }
    }
    if(d.side==="buy" && d.product && d.party){
      const same=bts.find(b=>b.code===d.code&&sameProduct(b.product,d.product)
        &&normCo(b.party)===normCo(d.party)&&b.date===d.date);
      if(same) out.push({t:"Same party, same day",m:same.batchNo+" is already open from "+shortName(d.party)
        +" for "+canonProduct(d.product)+" on "+dmy(d.date)+"."});

    return out;
  };

  const inBook=(x)=>filter==="all"||x.code===filter;
  const inProduct=(b)=> prod==="all" || sameProduct(b.product,prod);
  /* every word typed must appear somewhere in the deal — party, product, rate, qty, port, note… */
  const dealText=(d)=>[d.batchNo,d.code,d.party,canonProduct(d.product),canonPort(d.port),d.port,
    d.qty,d.rate,d.storage,d.payment,d.comments,d.enteredBy,dmy(d.date),d.date]
    .map(x=>String(x??"")).join(" ").toLowerCase();
  const terms=q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const hit=(txt)=>terms.every(t=>txt.includes(t));
  const matches=(b)=> !terms.length || hit(dealText(b)) || salesOf(deals,b.id).some(x=>hit(dealText(x)));
  const inPeriod=(b)=>{
    if(period.mode==="month"&&period.month) return String(b.date).slice(0,7)===period.month;
    if(period.mode==="range"){ if(period.from&&b.date<period.from) return false; if(period.to&&b.date>period.to) return false; return true; }
    return true;
  };
  const open=bts.filter(b=>inBook(b)&&b.balance>0.001&&matches(b));
  const closed=bts.filter(b=>inBook(b)&&b.balance<=0.001&&inPeriod(b)&&inProduct(b)&&matches(b));
  const loose=deals.filter(d=>d.side==="sell"&&allocTotal(d)+0.001<(+d.qty||0)).filter(inBook);
  const inTank=open.reduce((s,b)=>s+b.balance,0);
  /* every deal carrying a commission, buy or sell, newest first */
  const commRows=deals.filter(d=>Math.abs(+d.comm||0)>0).filter(inBook)
    .filter(d=> prod==="all"||sameProduct(d.product,prod))
    .filter(d=>{
      if(period.mode==="month"&&period.month) return String(d.date).slice(0,7)===period.month;
      if(period.mode==="range"){ if(period.from&&d.date<period.from) return false;
        if(period.to&&d.date>period.to) return false; }
      return true;
    })
    .filter(d=>!terms.length||hit(dealText(d)))
    .sort((a,b)=> a.date<b.date?1:-1);
  const commTotal=commRows.reduce((t,d)=>t+(+d.comm||0)*(+d.qty||0)*1000,0);
  /* Commission per kg, signed by direction of money:
       +5  we RECEIVE 5/kg  -> adds to profit
       -2  we PAY 2/kg      -> reduces profit
     Works the same on a purchase or a sale.  */
  const commOf=(d,qty)=> (+d.comm||0) * (qty!==undefined?qty:(+d.qty||0)) * 1000;
  const commBatch=(b)=> commOf(b) + salesOf(deals,b.id).reduce((t,x)=>t+commOf(x,x.part),0);
  const margin=(b)=>salesOf(deals,b.id).reduce((t,x)=>t+(x.rate-b.rate)*x.part*1000,0);
  const pnl=(b)=>margin(b)+commBatch(b);
  const bookProducts=[...new Set(bts.filter(inBook).map(b=>canonProduct(b.product)).filter(Boolean))].sort();

  /* ---- report title describing exactly what is being shown ---- */
  const periodLabel=()=> period.mode==="month"&&period.month
      ? "Month of "+period.month.split("-").reverse().join("/")
    : period.mode==="range"&&(period.from||period.to)
      ? "Period "+(period.from?dmy(period.from):"start")+" to "+(period.to?dmy(period.to):"today")
      : "All time";
  const reportTitle=()=> (book?book.name:"")+" — "+(tab==="open"?"Open deals":"Closed deals");
  const reportSub=()=> [periodLabel(), prod==="all"?"All products":prod,
      filter==="all"?"Both firms":filter,
      (book&&book.brokers&&book.brokers.length)?"Broker: "+book.brokers.join(" / "):"",
      "Printed "+dmy(today())].filter(Boolean).join("  ·  ");

  const saveFile=(name,text,type)=>{
    try{
      const blob=new Blob([text],{type:type});
      const a=document.createElement("a");
      a.href=URL.createObjectURL(blob); a.download=name;
      document.body.appendChild(a); a.click();
      setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500);
    }catch(e){ setErr("Could not download: "+e.message); }
  };

  /* ---- Excel: a CSV file, which Excel opens directly ---- */
  const downloadExcel=()=>{
    const rows=tab==="open"?open:closed;
    const q=(v)=>'"'+String(v??"").replace(/"/g,'""')+'"';
    const head=["Batch","Co","Date","Purchase party","Product","Port","Qty t"]
      .concat(canSeePnl?["Rate"]:[])
      .concat(["Storage","Comments","Sale date","Sale party","Sale qty t"])
      .concat(canSeePnl?["Sale rate","P&L Rs"]:["Balance t"]);
    const out=[[reportTitle()].map(q).join(","),[reportSub()].map(q).join(","),"",head.map(q).join(",")];
    rows.forEach(b=>{
      out.push(["", b.batchNo,b.code,dmy(b.date),b.party,canonProduct(b.product),canonPort(b.port)||b.port,n2(b.qty)]
        .slice(1).concat(canSeePnl?[n2(b.rate)]:[])
        .concat([b.storage,b.comments,"","",""])
        .concat(canSeePnl?["",""]:[n2(b.balance)]).map(q).join(","));
      salesOf(deals,b.id).forEach(x=>{
        out.push(["","","","","","",""].concat(canSeePnl?[""]:[])
          .concat(["","",dmy(x.date),x.party,n2(x.part)])
          .concat(canSeePnl?[n2(x.rate),Math.round((x.rate-b.rate)*x.part*1000)]:[""]).map(q).join(","));
      });
      if(canSeePnl) out.push(["","","","","","",""].concat([""]).concat(["","","","","", "", "batch total "+Math.round(pnl(b))]).map(q).join(","));
    });
    saveFile((book?book.name.replace(/[^A-Za-z0-9]+/g,"-"):"deals")+"-"+tab+"-"+today()+".csv",
      "\ufeff"+out.join("\n"), "text/csv;charset=utf-8;");
  };

  /* ---- PDF: a print-ready page the phone or laptop saves as PDF ---- */
  const downloadPdf=()=>{
    const rows=tab==="open"?open:closed;
    const esc=(v)=>String(v??"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
    const totQty=rows.reduce((t,b)=>t+(+b.qty||0),0);
    const totBuy=rows.reduce((t,b)=>t+(+b.qty||0)*1000*b.rate,0);
    const totPnl=rows.reduce((t,b)=>t+pnl(b),0);
    const cols = canSeePnl ? 13 : 11;
    let body="";
    rows.forEach(b=>{
      body+="<tr class='b'><td>"+esc(b.batchNo)+"</td><td>"+esc(b.code)+"</td><td>"+dmy(b.date)+"</td>"
        +"<td>"+esc(shortName(b.party))+"</td><td>"+esc(canonProduct(b.product))+"</td>"
        +"<td>"+esc(canonPort(b.port)||b.port||"")+"</td><td class='n'>"+n2(b.qty)+"</td>"
        +(canSeePnl?"<td class='n'>"+n2(b.rate)+"</td>":"")
        +"<td colspan='3'>"+esc(b.storage||"")+"</td>"
        +"<td class='n'>"+(b.balance>0.001?n2(b.balance)+" t":"closed")+"</td>"
        +(canSeePnl?"<td class='n "+(pnl(b)>=0?"g":"r")+"'>"+esc(money(pnl(b)))+"</td>":"")+"</tr>";
      salesOf(deals,b.id).forEach(x=>{
        const m=(x.rate-b.rate)*x.part*1000;
        body+="<tr><td class='i'>&#8627;</td><td colspan='"+(canSeePnl?7:6)+"'></td>"
          +"<td>"+dmy(x.date)+"</td><td>"+esc(shortName(x.party))+"</td><td class='n'>"+n2(x.part)+"</td>"
          +(canSeePnl?"<td class='n'>"+n2(x.rate)+"</td><td class='n "+(m>=0?"g":"r")+"'>"+esc(money(m))+"</td>":"<td></td>")
          +"</tr>";
      });
    });
    const html="<!doctype html><html><head><meta charset='utf-8'><title>"+esc(reportTitle())+"</title><style>"
      +"@page{size:A4 landscape;margin:12mm}"
      +"body{font-family:Helvetica,Arial,sans-serif;color:#14202B;margin:0}"
      +"h1{font-size:16pt;margin:0 0 2px}.sub{font-size:8pt;color:#6C7885;margin-bottom:10px}"
      +".sum{width:100%;border-collapse:collapse;margin-bottom:10px}"
      +".sum th{background:#14202B;color:#fff;font-size:7pt;letter-spacing:.06em;text-transform:uppercase;padding:5px}"
      +".sum td{background:#F2F5F8;text-align:center;font-size:12pt;font-weight:bold;padding:6px;border:.5px solid #CDD6DE}"
      +"table.d{width:100%;border-collapse:collapse}"
      +"table.d th{background:#14202B;color:#fff;font-size:6.5pt;text-transform:uppercase;padding:4px;text-align:left}"
      +"table.d td{font-size:7.5pt;padding:3.5px 4px;border:.4px solid #CDD6DE}"
      +"tr.b td{background:#F2F5F8;font-weight:bold;border-top:1pt solid #14202B}"
      +".n{text-align:right}.i{color:#6C7885}.g{color:#17795E}.r{color:#B4432B}"
      +".ft{font-size:6.5pt;color:#6C7885;margin-top:8px}"
      +"</style></head><body>"
      +"<h1>"+esc(reportTitle())+"</h1><div class='sub'>"+esc(reportSub())+"</div>"
      +"<table class='sum'><tr><th>Batches</th><th>Quantity</th>"
      +(canSeePnl?"<th>Purchase value</th><th>Profit / loss</th>":"")+"</tr><tr>"
      +"<td>"+rows.length+"</td><td>"+n2(totQty)+" t</td>"
      +(canSeePnl?"<td>"+esc(money(totBuy))+"</td><td style='color:"+(totPnl>=0?"#17795E":"#B4432B")+"'>"
        +esc(money(totPnl))+"</td>":"")+"</tr></table>"
      +"<table class='d'><tr><th>Batch</th><th>Co</th><th>Date</th><th>Purchase party</th><th>Product</th>"
      +"<th>Port</th><th class='n'>Qty t</th>"+(canSeePnl?"<th class='n'>Rate</th>":"")
      +"<th colspan='3'>Storage</th><th class='n'>Balance</th>"+(canSeePnl?"<th class='n'>P&amp;L</th>":"")+"</tr>"
      +body+"</table>"
      +"<div class='ft'>Rates are Rs per kg. Profit and loss is the sale rate less the purchase rate of the batch "
      +"the quantity came from. Generated from Bulk Deals.</div></body></html>";
    const f=document.createElement("iframe");
    f.style.cssText="position:fixed;right:0;bottom:0;width:0;height:0;border:0";
    document.body.appendChild(f);
    const d=f.contentWindow.document; d.open(); d.write(html); d.close();
    setTimeout(()=>{ try{ f.contentWindow.focus(); f.contentWindow.print(); }
      catch(e){ setErr("Could not open the print view: "+e.message); }
      setTimeout(()=>f.remove(),1500); },400);
  };

  const csv=()=>{
    const q=(v)=>'"'+String(v??"").replace(/"/g,'""')+'"';
    const lines=[["side","batch","company","date","party","product","port","qty_ton","rate_per_kg","storage","payment","comments","entered_by","taken_from"].join(",")];
    bts.forEach(b=>{
      lines.push([b.side,b.batchNo,b.code,b.date,b.party,canonProduct(b.product),b.port,b.qty,b.rate,b.storage,b.payment,b.comments,b.enteredBy,""].map(q).join(","));
      salesOf(deals,b.id).forEach(x=>lines.push(["sell","",x.code,x.date,x.party,canonProduct(x.product),x.port,x.part,x.rate,x.storage,x.payment,x.comments,x.enteredBy,b.batchNo].map(q).join(",")));
    });
    return lines.join("\n");
  };

  return (
    <div className="db">
      <header><div className="wrap" style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:10}}>
        <div style={{display:"flex",alignItems:"center",gap:10,minWidth:0}}>
          {screen!=="home" && <button className="back" onClick={back}>← Back</button>}
          <div onClick={goHome} style={{cursor:"pointer",minWidth:0}}>
            <div className="eyebrow">{book? book.name : "no book yet"}{book?" · "+myRole:""}</div>
            <h1>Bulk Deals</h1>
          </div>
        </div>
        <button className="back" onClick={()=>setPeople(true)}>{who}</button>
      </div></header>

      <div className="wrap">
        {msg && <div className="card" style={{borderColor:"var(--buy)",padding:"10px 14px"}}><b style={{fontSize:13}}>{msg}</b></div>}
        {err && <div className="err" style={{margin:"12px 0"}}>{err}</div>}

        {!book && (
          <div className="card">
            <h2>No book yet</h2>
            <p className="hint" style={{marginTop:6}}>
              {isSuper? "Tap your name at the top and create the first book."
                : "Ask the admin to add "+myEmail+" to a book."}</p>
          </div>)}

        {book && books.length>1 && (
          <div className="tabs">{books.map(b=>(
            <button key={b.id} data-on={b.id===bookId?"1":"0"} onClick={()=>setBookId(b.id)}>{b.name}</button>))}
          </div>)}

        {/* ---------- HOME ---------- */}
        {book && screen==="home" && (<>
          <div className="big">
            <button className="b" onClick={()=>{setSide("buy");setText("");setErr("");setScreen("entry");}}>
              <span className="t">Buy deal</span><span className="h">opens a new batch</span></button>
            <button className="s" onClick={()=>{setSide("sell");setText("");setErr("");setScreen("entry");}}>
              <span className="t">Sell deal</span><span className="h">deducts from a batch</span></button>
          </div>

          <div className="tabs">
            <button data-on={tab==="open"?"1":"0"} onClick={()=>setTab("open")}>Open deals ({open.length})</button>
            <button data-on={tab==="closed"?"1":"0"} onClick={()=>setTab("closed")}>Closed deals ({closed.length})</button>
            {canSeePnl && <button data-on={tab==="comm"?"1":"0"} onClick={()=>setTab("comm")}>Commission ({commRows.length})</button>}
          </div>

          <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:10,alignItems:"center"}}>
            {[["all","Both"],...companies.map(c=>[c.code,c.code])].map(([k,l])=>(
              <button key={k} className="btn ghost small" style={k===filter?{background:"var(--ink)",color:"#fff"}:{}}
                onClick={()=>setFilter(k)}>{l}</button>))}
            <button className="btn ghost small" onClick={downloadPdf}>PDF</button>
            <button className="btn ghost small" onClick={downloadExcel}>Excel</button>
            <button className="btn ghost small" onClick={()=>setDump({kind:"csv",text:csv()})}>Backup</button>
            <span className="eyebrow">{tab==="open"? n2(inTank)+" t in tank" : closed.length+" closed"} · live</span>
          </div>

          <div style={{display:"flex",gap:6,marginBottom:10,alignItems:"center"}}>
            <input value={q} onChange={(e)=>setQ(e.target.value)}
              placeholder="Search — party, product, rate, quantity, port, note" style={{flex:1}} />
            {q && <button className="btn ghost small" onClick={()=>setQ("")}>clear</button>}
          </div>
          {terms.length>0 && <p className="hint" style={{marginTop:-4,marginBottom:10}}>
            {(tab==="open"?open:closed).length} deal{(tab==="open"?open:closed).length===1?"":"s"} contain
            {terms.map(t=>" “"+t+"”").join(" and")} — batches and their sales are both searched.
          </p>}

          {(tab==="closed"||tab==="comm") && (
            <div className="card" style={{marginTop:0}}>
              <p className="hint" style={{margin:"0 0 6px"}}>Product</p>
              <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:12}}>
                <button className="btn ghost small" style={prod==="all"?{background:"var(--ink)",color:"#fff"}:{}}
                  onClick={()=>setProd("all")}>All products</button>
                {bookProducts.map(pd=>(
                  <button key={pd} className="btn ghost small" style={prod===pd?{background:"var(--ink)",color:"#fff"}:{}}
                    onClick={()=>setProd(pd)}>{pd}</button>))}
              </div>
              <p className="hint" style={{margin:"0 0 6px"}}>Period</p>
              <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                {[["all","All time"],["month","By month"],["range","Custom dates"]].map(([k,l])=>(
                  <button key={k} className="btn ghost small" style={period.mode===k?{background:"var(--ink)",color:"#fff"}:{}}
                    onClick={()=>setPeriod({...period,mode:k})}>{l}</button>))}
              </div>
              {period.mode==="month" && <div style={{marginTop:10,maxWidth:220}}>
                <label><span>Month</span><input type="month" value={period.month}
                  onChange={(e)=>setPeriod({...period,month:e.target.value})} /></label></div>}
              {period.mode==="range" && <div className="row" style={{marginTop:10}}>
                <label><span>From</span><input type="date" value={period.from} onChange={(e)=>setPeriod({...period,from:e.target.value})} /></label>
                <label><span>To</span><input type="date" value={period.to} onChange={(e)=>setPeriod({...period,to:e.target.value})} /></label>
              </div>}
              {tab==="closed" && <div style={{marginTop:12}}>
                <div className="kv"><span>Batches closed{prod==="all"?"":" · "+prod}</span><b>{closed.length}</b></div>
                <div className="kv"><span>Quantity traded</span><b>{n2(closed.reduce((t,b)=>t+(+b.qty||0),0))} t</b></div>
                {canSeePnl && <div className="kv"><span>Purchase value</span><b>{money(closed.reduce((t,b)=>t+(+b.qty||0)*1000*b.rate,0))}</b></div>}
                {canSeePnl && <div className="kv"><span>Trading margin</span>
                  <b className={closed.reduce((t,b)=>t+margin(b),0)>=0?"good":"bad"}>{money(closed.reduce((t,b)=>t+margin(b),0))}</b></div>}
                {canSeePnl && <div className="kv"><span>Commission</span>
                  <b className={closed.reduce((t,b)=>t+commBatch(b),0)>=0?"good":"bad"}>
                    {money(closed.reduce((t,b)=>t+commBatch(b),0))}</b></div>}
                {canSeePnl && <div className="kv"><span><b>Profit / loss</b></span>
                  <b className={closed.reduce((t,b)=>t+pnl(b),0)>=0?"good":"bad"}>{money(closed.reduce((t,b)=>t+pnl(b),0))}</b></div>}
              </div>}
            </div>)}

          {tab==="comm" && (
            <div className="card">
              <h2>Commission</h2>
              <p className="hint" style={{margin:"0 0 12px"}}>
                Every deal carrying a commission, on purchases and sales alike. A plus is money coming to us and
                adds to profit; a minus is money we pay and comes off it.</p>
              <div className="scrollx">
                <table style={{minWidth:760}}>
                  <thead><tr>
                    <th className="sticky">Date</th><th>Side</th><th>Co</th><th>Party</th><th>Product</th>
                    <th style={{textAlign:"right"}}>Qty t</th><th style={{textAlign:"right"}}>₹/kg</th>
                    <th style={{textAlign:"right"}}>Amount</th><th>From</th>
                  </tr></thead>
                  <tbody>
                    {commRows.length===0 && <tr><td colSpan={9} style={{padding:20,textAlign:"center",color:"var(--mute)"}}>
                      No commission recorded in this period.</td></tr>}
                    {commRows.map(d=>(
                      <tr key={d.id} className="sale">
                        <td className="sticky mono">{dmy(d.date)}</td>
                        <td><span className={d.side==="buy"?"":"bad"}>{d.side}</span></td>
                        <td>{d.code}</td>
                        <td title={d.party}>{shortName(d.party)}</td>
                        <td>{canonProduct(d.product)}</td>
                        <td className="num">{n2(d.qty)}</td>
                        <td className={"num "+((+d.comm||0)>=0?"good":"bad")}>
                          {(+d.comm||0)>=0?"+":"−"}{n2(Math.abs(+d.comm||0))}</td>
                        <td className={"bal "+((+d.comm||0)>=0?"good":"bad")}>
                          {money((+d.comm||0)*(+d.qty||0)*1000)}</td>
                        <td style={{color:"var(--mute)"}}>
                          {(+d.comm||0)>=0 ? "receive from "+(d.side==="buy"?"seller":"buyer")
                                           : "pay to "+(d.side==="buy"?"seller":"buyer")}</td>
                      </tr>))}
                  </tbody>
                </table>
              </div>
              <div className="kv" style={{marginTop:12}}><span>Receivable</span>
                <b className="good">{money(commRows.reduce((t,d)=>t+Math.max((+d.comm||0)*(+d.qty||0)*1000,0),0))}</b></div>
              <div className="kv"><span>Payable</span>
                <b className="bad">{money(commRows.reduce((t,d)=>t+Math.min((+d.comm||0)*(+d.qty||0)*1000,0),0))}</b></div>
              <div className="kv"><span><b>Net commission</b></span>
                <b className={commTotal>=0?"good":"bad"}>{money(commTotal)}</b></div>
            </div>)}

          {tab!=="comm" && <Ledger rows={tab==="open"?open:closed} deals={deals} canEdit={canEdit} canSeePnl={canSeePnl}
            brokerList={brokerList} forceOpen={terms.length>0}
            empty={terms.length
              ? "Nothing matched. Try shorter pieces — “sah 57” works better than the full spelling."
              : tab==="open"?"No stock in hand. Enter a buy deal to open a batch."
                : prod==="all"?"Nothing closed in this period.":"No "+prod+" closed in this period."}
            onBatch={(b)=>setSheet({batch:b})} onSale={(s,fromId)=>setSheet({sale:s,fromId})} />}

          {tab==="open" && loose.length>0 && (
            <div className="card" style={{borderColor:"var(--sell)"}}>
              <h2 style={{color:"var(--sell)"}}>Sales not tied to a batch</h2>
              {loose.map(s=>(<div className="kv" key={s.id}>
                <span>{dmy(s.date)} · {shortName(s.party)} · {s.product}</span>
                <b>{n2((+s.qty||0)-allocTotal(s))} t open
                  {canEdit && <button className="btn ghost small" style={{marginLeft:8}}
                    onClick={()=>setSheet({sale:s,fromId:null})}>attach</button>}</b></div>))}
            </div>)}
        </>)}

        {/* ---------- ENTRY ---------- */}
        {book && screen==="entry" && (
          <div className="card">
            <div className="crumb"><span className={"pill"+(side==="sell"?" sell":"")}>{side} deal</span></div>
            <h2>{side==="buy"?"What did we buy?":"What did we sell?"}</h2>
            <div className="sech">Which of our firms is this for?</div>
            <div className="books">{companies.map(c=>(
              <button key={c.code} data-on={code===c.code?"1":"0"} onClick={()=>setCode(c.code)}>
                <span className="c">{c.code}</span><span className="n">{c.name}</span></button>))}</div>
            <div className="sech">Port</div>
            <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
              {PORTS.map(pt=>(<button key={pt} className="btn ghost small"
                style={port===pt?{background:"var(--ink)",color:"#fff"}:{}}
                onClick={()=>setPort(port===pt?"":pt)}>{pt}{pt==="JNPT"?" / Mumbai":""}</button>))}
            </div>
            <p className="hint" style={{margin:"12px 0 8px"}}>
              Paste the confirmation, or type it plainly: <i>{side==="buy"
                ? "Tashcam methanol three hundred fifty mt price 57 storage 10 days mundra"
                : "Aryan chemical PG 32 mt 156 rs kandla"}</i></p>
            <textarea value={text} onChange={(e)=>setText(e.target.value)} placeholder="Type or paste here" />
            <div style={{display:"flex",gap:8,marginTop:12,flexWrap:"wrap"}}>
              <button className="btn" onClick={read} disabled={!text.trim()}>Read it</button>
              <button className="btn ghost" onClick={()=>{setDraft(normalise({}));setQueue([]);setScreen("confirm");}}>Fill by hand</button>
              <button className="btn ghost" onClick={goHome}>Home</button>
            </div>
          </div>)}

        {/* ---------- CONFIRM ---------- */}
        {book && screen==="confirm" && draft && (
          <div className="card">
            <div className="crumb">
              <span className={"pill"+(draft.side==="sell"?" sell":"")}>{draft.side} deal</span>
              {draft.side==="buy" && <span className="pill batch">batch {nextBatchNo(deals,draft.code)}</span>}
              {queue.length>0 && <span className="eyebrow">{queue.length} more to confirm</span>}
            </div>
            <h2>Check this before it goes in</h2>
            {missing(draft).length>0 && <div className="flag" style={{marginBottom:10}}>
              <span className="flagicon">⚑</span><div><b>Still needed.</b> {missing(draft).join(", ")} — the boxes
              below are marked in red.</div></div>}
            {entryFlags(draft).map((f,i)=>(
              <div className="flag" style={{marginBottom:10}} key={i}>
                <span className="flagicon">⚑</span><div><b>{f.t}.</b> {f.m}</div></div>))}

            <div className="sech">Our firm</div>
            <div className="books">{companies.map(c=>(
              <button key={c.code} data-on={draft.code===c.code?"1":"0"} onClick={()=>setDraft({...draft,code:c.code})}>
                <span className="c">{c.code}</span><span className="n">{c.name}</span></button>))}</div>

            <div className="row" style={{marginTop:12}}>
              <F label={draft.side==="buy"?"Purchase party":"Sale party"} value={draft.party}
                missing={missing(draft).includes("party")} ph="party name" onChange={(v)=>setDraft({...draft,party:v})} />
              <F label="Product" value={draft.product} missing={missing(draft).includes("product")} ph="Methanol"
                onChange={(v)=>setDraft({...draft,product:v})} />
            </div>
            {parties.length>0 && <div style={{display:"flex",gap:6,flexWrap:"wrap",marginTop:8}}>
              {parties.filter(p=>!draft.party||normCo(p).includes(normCo(draft.party).split(" ")[0]||"###")).slice(0,6)
                .map(p=>(<button key={p} className="btn ghost small" onClick={()=>setDraft({...draft,party:p})}>{shortName(p)}</button>))}
            </div>}
            <div style={{display:"flex",gap:6,flexWrap:"wrap",marginTop:8}}>
              {PRODUCT_CODES.slice(0,11).map(p=>(<button key={p} className="btn ghost small"
                style={canonProduct(draft.product)===p?{background:"var(--ink)",color:"#fff"}:{}}
                onClick={()=>setDraft({...draft,product:p})}>{p}</button>))}
            </div>
            <div className="sech" style={{color:missing(draft).includes("port")?"var(--sell)":"var(--ink)"}}>Port{missing(draft).includes("port")?" · needed":""}</div>
            <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
              {PORTS.map(pt=>(<button key={pt} className="btn ghost small"
                style={canonPort(draft.port)===pt?{background:"var(--ink)",color:"#fff"}:{}}
                onClick={()=>setDraft({...draft,port:pt})}>{pt}{pt==="JNPT"?" / Mumbai":""}</button>))}
            </div>
            <div className="row" style={{marginTop:10}}>
              <F label="Qty (ton)" value={draft.qty} missing={missing(draft).includes("qty")} ph="30" onChange={(v)=>setDraft({...draft,qty:v})} />
              <F label="Rate ₹/kg" value={draft.rate} missing={missing(draft).includes("rate")} ph="57" onChange={(v)=>setDraft({...draft,rate:v})} />
            </div>
            {draft.qtyMin>0 && draft.qtyMin!==draft.qtyMax && <div className="hint" style={{marginTop:6}}>
              Written as {n2(draft.qtyMin)}–{n2(draft.qtyMax)} t.
              <button className="btn ghost small" style={{marginLeft:6}} onClick={()=>setDraft({...draft,qty:draft.qtyMin})}>use min</button>
              <button className="btn ghost small" style={{marginLeft:4}} onClick={()=>setDraft({...draft,qty:draft.qtyMax})}>use max</button></div>}
            <div className="row" style={{marginTop:10}}>
              <F label="Date" type="date" value={draft.date} onChange={(v)=>setDraft({...draft,date:v})} />
              <F label="Storage" value={draft.storage} ph="10 days" onChange={(v)=>setDraft({...draft,storage:v})} />
            </div>
            <div className="row" style={{marginTop:10}}>
              <F label="Payment" value={draft.payment} ph="70 days PDC" onChange={(v)=>setDraft({...draft,payment:v})} />
              <F label="Broker" value={draft.broker} missing={!!brokerMismatch(draft)}
                ph={(book.brokers||[]).join(" / ")||"broker name"} onChange={(v)=>setDraft({...draft,broker:v})} />
            </div>
            <div className="row" style={{marginTop:10}}>
              <F label="Commission ₹/kg — + take, − give" value={draft.comm} ph="0"
                onChange={(v)=>setDraft({...draft,comm:v})} />
              <F label="Comments" value={draft.comments} ph="anything to remember" onChange={(v)=>setDraft({...draft,comments:v})} />
            </div>
            {!!(+draft.comm) && (()=>{ const c=+draft.comm, amt=c*(+draft.qty||0)*1000;
              const who=draft.side==="buy"?(shortName(draft.party)||"the seller"):(shortName(draft.party)||"the buyer");
              return <p className="hint" style={{marginTop:6}}>
                {c>0 ? <>₹{n2(c)}/kg <b>receivable from</b> {who} — <b className="good">{money(amt)}</b> added to profit.</>
                     : <>₹{n2(-c)}/kg <b>payable to</b> {who} — <b className="bad">{money(amt)}</b> off the profit.</>}
              </p>; })()}
            <div style={{display:"flex",gap:8,marginTop:16,flexWrap:"wrap"}}>
              {draft.side==="buy"
                ? <button className="btn" onClick={commitBuy}>{saving?"Saving…":"OK — open batch "+nextBatchNo(deals,draft.code)}</button>
                : <button className="btn" onClick={()=>{ const g=missing(draft);
                    if(g.length) return setErr("Fill in "+g.join(", ")+" first.");
                    setErr("");setAlloc({});setShowAll(false);setScreen("pick"); }}>OK — choose batch</button>}
              <button className="btn ghost" onClick={back}>Back</button>
              {queue.length>0 && <button className="btn ghost" onClick={nextInQueue}>Skip this one</button>}
            </div>
          </div>)}

        {/* ---------- BATCH PICK ---------- */}
        {book && screen==="pick" && draft && (()=>{
          const need=+draft.qty||0;
          const mine=bts.filter(b=>b.code===draft.code&&b.balance>0.0001);
          const match=mine.filter(b=>sameProduct(b.product,draft.product));
          const list=match.length&&!showAll?match:mine;
          const done=Object.values(alloc).reduce((s,v)=>s+(+v||0),0);
          const left=+(need-done).toFixed(3);
          const cost=Object.entries(alloc).reduce((s,[id,q])=>{const b=bts.find(x=>x.id===id);return s+(b?(+q||0)*b.rate:0);},0);
          const marg=done>0?+draft.rate-cost/done:0;
          return (
            <div className="card">
              <div className="crumb"><span className="pill sell">sell</span>
                <span className="eyebrow">{n2(need)} t {draft.product} to {shortName(draft.party)}</span></div>
              <h2>Which batch does it come out of?</h2>
              <p className="hint" style={{margin:"0 0 12px"}}>
                {match.length? match.length+" batch"+(match.length>1?"es":"")+" of "+draft.product+" still have balance."
                  : "No open batch of "+draft.product+" — showing every open batch."}</p>
              {list.map(b=>{ const on=+alloc[b.id]>0; return (
                <button key={b.id} className="pick" data-on={on?"1":"0"} onClick={()=>{
                  if(on){const c={...alloc};delete c[b.id];setAlloc(c);}
                  else setAlloc({...alloc,[b.id]:String(+Math.min(b.balance,Math.max(left,0)).toFixed(3))});
                }}>
                  <div className="g">
                    <div className="no">{b.batchNo}</div>
                    <div className="nm">{shortName(b.party)}</div>
                    <div className="eyebrow" style={{marginTop:2}}>{b.product} · {dmy(b.date)} · ₹{n2(b.rate)}/kg{b.port?" · "+b.port:""}</div>
                  </div>
                  <div className="q">{n2(b.balance)} t<i>balance</i></div>
                </button>); })}
              {list.length===0 && <div className="flag"><span className="flagicon">⚑</span>
                <div><b>No batch with balance left.</b> You can still save the sale and attach it to a batch later.</div></div>}
              {Object.keys(alloc).length>0 && <div style={{marginTop:10}}>
                {Object.entries(alloc).map(([id,q])=>{ const b=bts.find(x=>x.id===id); if(!b) return null; return (
                  <div key={id} style={{display:"flex",gap:8,alignItems:"center",padding:"6px 0"}}>
                    <span style={{flex:1,fontSize:13}}>{b.batchNo} · {shortName(b.party)}</span>
                    <input className="mono" style={{width:96}} value={q} inputMode="decimal"
                      onChange={(e)=>setAlloc({...alloc,[id]:e.target.value})} />
                    <span className="eyebrow">of {n2(b.balance)}</span></div>); })}
              </div>}
              <div className="kv" style={{marginTop:8}}><span>Taken</span><b>{n2(done)} of {n2(need)} t</b></div>
              {left>0.001 && <div className="flag" style={{marginTop:10}}>
                <span className="flagicon">⚑</span><div><b>{n2(left)} t not tied to a batch.</b> Saving like this
                leaves it showing under “sales not tied to a batch” until you attach it.</div></div>}
              {left<-0.001 && <div className="flag" style={{marginTop:10}}>
                <span className="flagicon">⚑</span><div><b>Taken {n2(-left)} t more than the sale.</b> Reduce the
                quantities above before saving.</div></div>}
              {done>0 && canSeePnl && <div className="kv"><span>Margin</span>
                <b className={marg>=0?"good":"bad"}>{marg>=0?"+":"−"}₹{n2(Math.abs(marg))}/kg · {money(done*1000*marg)}</b></div>}
              <div style={{display:"flex",gap:8,marginTop:14,flexWrap:"wrap"}}>
                <button className="btn" onClick={()=>{ if(left<-0.001) return setErr("Taken more than the sale."); commitSell(); }}>
                  {saving?"Saving…":"OK — book the sale"}</button>
                <button className="btn ghost" onClick={()=>setScreen("confirm")}>Back</button>
              </div>
            </div>); })()}
      </div>

      {/* ---------- sheets ---------- */}
      {sheet && (<div className="sheet" onClick={(e)=>e.target.classList.contains("sheet")&&setSheet(null)}><div className="in">
        {sheet.sale && (()=>{ const s=deals.find(x=>x.id===sheet.sale.id)||sheet.sale; return (
          <SaleEdit s={s} fromId={sheet.fromId} bts={bts} canEdit={canEdit}
            onSave={async(u)=>{ try{ const {part,...clean}=u; await patchDeal(clean); setSheet(null); flash("Sale updated."); }
              catch(e){ setErr(e.message); } }}
            onMove={(toId)=>moveSale(s,sheet.fromId,toId)}
            onAttach={async(b)=>{ const openQty=(+s.qty||0)-allocTotal(s);
              const take=Math.min(openQty,Math.max(b.balance,0))||openQty;
              try{ await patchDeal({id:s.id,allocations:[...(s.allocations||[]),{batchId:b.id,qty:+take.toFixed(3)}]});
                setSheet(null); flash("Attached "+n2(take)+" t to "+b.batchNo+"."); }catch(e){ setErr(e.message); } }}
            onDelete={()=>setConfirmKill(s)} onClose={()=>setSheet(null)} />); })()}
        {sheet.batch && <BatchEdit b={sheet.batch} canEdit={canEdit}
          onSave={async(u)=>{ try{ const {sold,balance,...clean}=u; await patchDeal(clean); setSheet(null); flash(clean.batchNo+" updated."); }
            catch(e){ setErr(e.message); } }}
          onDelete={()=>setConfirmKill(sheet.batch)} onClose={()=>setSheet(null)} />}
      </div></div>)}

      {confirmKill && (<div className="sheet" onClick={(e)=>e.target.classList.contains("sheet")&&setConfirmKill(null)}><div className="in">
        <h2>Delete this {confirmKill.side==="buy"?"batch":"sale"}?</h2>
        <p className="hint" style={{margin:"6px 0 14px"}}>{dmy(confirmKill.date)} · {shortName(confirmKill.party)} ·
          {" "}{n2(confirmKill.qty)} t {confirmKill.product} @ ₹{n2(confirmKill.rate)}</p>
        <div style={{display:"flex",gap:8}}>
          <button className="btn danger" onClick={async()=>{ try{ await dropDeal(confirmKill.id); setConfirmKill(null); setSheet(null); flash("Deleted."); }
            catch(e){ setErr(e.message); } }}>Delete</button>
          <button className="btn ghost" onClick={()=>setConfirmKill(null)}>Keep it</button>
        </div></div></div>)}

      {dump && (<div className="sheet" onClick={(e)=>e.target.classList.contains("sheet")&&setDump(null)}><div className="in">
        <h2>Backup</h2>
        <p className="hint" style={{margin:"6px 0 10px"}}>Select all and paste into a spreadsheet or a mail to yourself.</p>
        <textarea readOnly value={dump.text} style={{minHeight:220,fontSize:11}} onFocus={(e)=>e.target.select()} />
        <div style={{display:"flex",gap:8,marginTop:12}}>
          <button className="btn" onClick={()=>{navigator.clipboard.writeText(dump.text);flash("Copied.");}}>Copy</button>
          <button className="btn ghost" onClick={()=>setDump(null)}>Close</button>
        </div></div></div>)}

      {people && <People user={user} isSuper={isSuper} book={book} books={books} db={db} FB={FB}
        note={note} setNote={setNote} onClose={()=>{setNote("");setPeople(false);}}
        onLock={()=>{sessionStorage.removeItem("unlockedUid");setUnlocked(false);setPeople(false);}}
        onSignOut={()=>doSignOut()} />}
    </div>);
}

/* ================= people & books ================= */
function People({user,isSuper,book,books,db,FB,note,setNote,onClose,onLock,onSignOut}){
  const [email,setEmail]=useState(""); const [bookName,setBookName]=useState("");
  const [reName,setReName]=useState(book?book.name:""); const [newBroker,setNewBroker]=useState("");
  const [nbBroker,setNbBroker]=useState("");
  const [pCode,setPCode]=useState(""); const [pAlias,setPAlias]=useState("");
  const [c1,setC1]=useState("AO"); const [n1,setN1]=useState("Agarwal Overseas");
  const [c2,setC2]=useState("AP"); const [n2n,setN2]=useState("A P Chemicals P Ltd");
  const myEmail=(user.email||"").trim().toLowerCase();
  const isBookAdmin = book && (isSuper || (book.admins||[]).map(x=>String(x).toLowerCase()).includes(myEmail));
  const save=async(patch)=>{ try{ await FB.updateDoc(FB.doc(db,"books",book.id),patch); setNote("Saved."); }
    catch(e){ setNote(e.message); } };
  const add=async(role)=>{
    const e=email.trim().toLowerCase(); if(!e.includes("@")) return setNote("Type a full email address.");
    let admins=(book.admins||[]).filter(x=>x!==e),
        members=(book.members||[]).filter(x=>x!==e),
        inputers=(book.inputers||[]).filter(x=>x!==e);
    if(role==="admin") admins.push(e);
    else if(role==="member") members.push(e);
    else inputers.push(e);
    await save({admins,members,inputers,everyone:[...new Set([...admins,...members,...inputers])]});
    setEmail("");
  };
  const remove=async(e)=>{
    const admins=(book.admins||[]).filter(x=>x!==e),
          members=(book.members||[]).filter(x=>x!==e),
          inputers=(book.inputers||[]).filter(x=>x!==e);
    await save({admins,members,inputers,everyone:[...new Set([...admins,...members,...inputers])]});
  };
  return (
    <div className="sheet" onClick={(e)=>e.target.classList.contains("sheet")&&onClose()}><div className="in">
      <h2>People and books</h2>
      {note && (/^saved|created|updated/i.test(note)
        ? <div className="warn" style={{margin:"0 0 10px"}}>{note}</div>
        : <div className="flag" style={{margin:"0 0 10px"}}><span className="flagicon">⚑</span><div>{note}</div></div>)}
      <div className="kv"><span>Signed in</span><b>{user.email}</b></div>
      <div className="kv"><span>App version</span><b>build {BUILD}</b></div>
      <div className="kv"><span>In this book</span><b>{isBookAdmin?"admin — can edit and delete":"can enter deals"}</b></div>

      {book && isBookAdmin && (<>
        <div className="sech">{book.name} — people</div>
        {[...(book.admins||[]).map(e=>[e,"admin — edit and delete"]),
          ...(book.members||[]).map(e=>[e,"enter + see profit"]),
          ...(book.inputers||[]).map(e=>[e,"enter only, no profit"])].map(([e,r])=>(
          <div key={e} style={{display:"flex",gap:8,alignItems:"center",padding:"7px 0",borderBottom:"1px dotted var(--line)"}}>
            <span style={{flex:1,minWidth:0,fontSize:13,overflow:"hidden",textOverflow:"ellipsis"}}>{e}
              <span className="eyebrow"> · {r}</span></span>
            {String(e).toLowerCase()!==myEmail && <button className="btn danger small" onClick={()=>remove(e)}>remove</button>}
          </div>))}
        <div style={{marginTop:10}}><F label="Add someone by email" value={email} ph="name@gmail.com" onChange={setEmail} /></div>
        <div style={{display:"flex",gap:8,marginTop:8,flexWrap:"wrap"}}>
          <button className="btn small" onClick={()=>add("inputer")}>Add — enter only</button>
          <button className="btn ghost small" onClick={()=>add("member")}>Add — enter + profit</button>
          <button className="btn ghost small" onClick={()=>add("admin")}>Add as admin</button>
        </div>
        <p className="hint" style={{marginTop:6}}>
          <b>Enter only</b> can add deals but never sees rates or profit. <b>Enter + profit</b> sees everything and
          can take reports. <b>Admin</b> can also change and delete deals, and manage this list.
        </p>

        <div className="sech">Book name and broker</div>
        <div className="row">
          <F label="Book name" value={reName} onChange={setReName} />
        </div>
        <button className="btn ghost small" style={{marginTop:8}} onClick={async()=>{
          const nm=reName.trim(); if(!nm) return setNote("Give the book a name.");
          await save({name:nm});
        }}>Rename book</button>

        <p className="hint" style={{margin:"14px 0 6px"}}>
          Deals pasted into this book are checked against these broker names. Add every spelling you use.</p>
        {(book.brokers||[]).map(bk=>(
          <div key={bk} style={{display:"flex",gap:8,alignItems:"center",padding:"6px 0",borderBottom:"1px dotted var(--line)"}}>
            <span style={{flex:1,fontSize:13}}>{bk}</span>
            <button className="btn danger small" onClick={()=>save({brokers:(book.brokers||[]).filter(x=>x!==bk)})}>remove</button>
          </div>))}
        <div className="row" style={{marginTop:8}}>
          <F label="Add broker name" value={newBroker} ph="Ajmera Chemsol / Vijay Ajmera" onChange={setNewBroker} />
        </div>
        <button className="btn ghost small" style={{marginTop:8}} onClick={async()=>{
          const bk=newBroker.trim(); if(!bk) return setNote("Type a broker name.");
          if((book.brokers||[]).includes(bk)) return setNote("Already listed.");
          await save({brokers:[...(book.brokers||[]),bk]}); setNewBroker("");
        }}>Add broker</button>

        <div className="sech">Product short forms</div>
        <p className="hint" style={{margin:"0 0 8px"}}>
          Methanol, PG, NBA, BA, Cyclo, Xylene, MEK, MIBK and the rest are built in. Add anything you trade that
          is missing, with every long name you might paste, so it always saves under the short form.</p>
        {(book.products||[]).map((pr,i)=>(
          <div key={i} style={{display:"flex",gap:8,alignItems:"center",padding:"6px 0",borderBottom:"1px dotted var(--line)"}}>
            <span style={{flex:1,minWidth:0,fontSize:13}}><b>{pr.code}</b>
              <span className="eyebrow"> · {(pr.alias||[]).join(", ")}</span></span>
            <button className="btn danger small"
              onClick={()=>save({products:(book.products||[]).filter((_,j)=>j!==i)})}>remove</button>
          </div>))}
        <div className="row" style={{marginTop:8}}>
          <F label="Short form" value={pCode} ph="SBP" onChange={setPCode} />
          <F label="Long names, comma separated" value={pAlias} ph="special boiling point spirit, sbp 62" onChange={setPAlias} />
        </div>
        <button className="btn ghost small" style={{marginTop:8}} onClick={async()=>{
          const c=pCode.trim(); if(!c) return setNote("Type the short form.");
          const al=[c,...pAlias.split(",").map(x=>x.trim()).filter(Boolean)];
          if((book.products||[]).some(x=>x.code.toLowerCase()===c.toLowerCase())) return setNote(c+" is already listed.");
          await save({products:[...(book.products||[]),{code:c,alias:al}]});
          setPCode(""); setPAlias("");
        }}>Add product</button>
      </>)}

      {isSuper && (<>
        <div className="sech">New book for another group</div>
        <F label="Book name" value={bookName} ph="BKM - AP Deals" onChange={setBookName} />
        <div style={{marginTop:8}}>
          <F label="Broker this book belongs to" value={nbBroker} ph="Bharat K Mehta" onChange={setNbBroker} />
        </div>
        <div className="row" style={{marginTop:8}}>
          <F label="Code 1" value={c1} onChange={setC1} /><F label="Firm 1" value={n1} onChange={setN1} />
        </div>
        <div className="row" style={{marginTop:8}}>
          <F label="Code 2" value={c2} onChange={setC2} /><F label="Firm 2" value={n2n} onChange={setN2} />
        </div>
        <button className="btn small" style={{marginTop:10}} onClick={async()=>{
          const nm=bookName.trim(); if(!nm) return setNote("Give the book a name.");
          const id=nm.toLowerCase().replace(/[^a-z0-9]+/g,"-").slice(0,30)+"-"+Date.now().toString(36).slice(-4);
          const bk=nbBroker.trim(); if(!bk) return setNote("Give the broker this book belongs to.");
          const companies=[{code:c1.trim().toUpperCase(),name:n1.trim()}];
          if(c2.trim()&&n2n.trim()) companies.push({code:c2.trim().toUpperCase(),name:n2n.trim()});
          try{
            await FB.setDoc(FB.doc(db,"books",id),{name:nm,companies,brokers:[bk],owner:myEmail,
              admins:[myEmail],members:[],inputers:[],everyone:[myEmail],createdAt:new Date().toISOString()});
            setBookName(""); setNbBroker(""); setNote(nm+" created.");
          }catch(e){ setNote(e.message); }
        }}>Create book</button>
      </>)}

      <div style={{display:"flex",gap:8,marginTop:16,flexWrap:"wrap"}}>
        <button className="btn ghost" onClick={onLock}>Lock (ask PIN again)</button>
        <button className="btn ghost" onClick={onSignOut}>Sign out</button>
        <button className="btn ghost" onClick={onClose}>Close</button>
      </div>
    </div></div>);
}

/* ================= ledger ================= */
function Ledger({rows,deals,empty,onBatch,onSale,canEdit,forceOpen,canSeePnl,brokerList}){
  const [open,setOpen]=useState({});
  const toggle=(id)=>setOpen(o=>({...o,[id]:!o[id]}));
  const commOf=(d,qty)=> (+d.comm||0)*(qty!==undefined?qty:(+d.qty||0))*1000;
  const commBatch=(b)=> commOf(b)+salesOf(deals,b.id).reduce((t,x)=>t+commOf(x,x.part),0);
  const margin=(b)=>salesOf(deals,b.id).reduce((t,x)=>t+(x.rate-b.rate)*x.part*1000,0);
  const pnl=(b)=>margin(b)+commBatch(b);
  const wrongBroker=(d)=>{
    const list=(brokerList||[]); if(!list.length) return false;
    const t=normCo(d.broker||""); if(!t) return false;
    return !list.some(x=> t.includes(x)||x.includes(t));
  };
  const withSales=rows.filter(b=>salesOf(deals,b.id).length);
  const allOpen=withSales.length>0&&withSales.every(b=>open[b.id]);
  return (<>
    {withSales.length>0 && <div style={{display:"flex",justifyContent:"flex-end",marginBottom:6}}>
      <button className="btn ghost small" onClick={()=>setOpen(Object.fromEntries(rows.map(b=>[b.id,!allOpen])))}>
        {allOpen?"collapse all":"expand all"}</button></div>}
    <div className="scrollx"><table>
      <thead><tr>
        <th className="sticky">Batch</th><th>Co</th><th>Date</th><th>Purchase party</th><th>Product</th><th>Port</th>
        <th style={{textAlign:"right"}}>Qty</th>{canSeePnl && <th style={{textAlign:"right"}}>Rate</th>}
        <th>Storage</th><th>Comments</th>
        <th>Sale date</th><th>Sale party</th><th style={{textAlign:"right"}}>Qty</th>
        {canSeePnl && <th style={{textAlign:"right"}}>Rate</th>}
        <th style={{textAlign:"right"}}>{canSeePnl?"Balance / P&L":"Balance"}</th>
      </tr></thead>
      <tbody>
        {rows.length===0 && <tr><td colSpan={canSeePnl?15:13} style={{padding:20,textAlign:"center",color:"var(--mute)"}}>{empty}</td></tr>}
        {rows.map(b=>{
          const sales=salesOf(deals,b.id); const isOpen=forceOpen||!!open[b.id];
          return (<Fragment key={b.id}>
            <tr className={"batch"+(wrongBroker(b)?" mismatch":"")} onClick={()=>sales.length&&toggle(b.id)}
              style={{cursor:sales.length?"pointer":"default"}} title={wrongBroker(b)?"Broker does not match this book":""}>
              <td className="sticky"><span style={{color:sales.length?"var(--buy)":"transparent",marginRight:4}}>{isOpen?"▾":"▸"}</span>
                {wrongBroker(b) && <span className="bad" title="wrong broker for this book">⚑ </span>}{b.batchNo}</td>
              <td>{b.code}</td><td className="mono">{dmy(b.date)}</td>
              <td title={b.party}>{shortName(b.party)}</td>
              <td>{canonProduct(b.product)}</td><td>{canonPort(b.port)||b.port||"—"}</td>
              <td className="num">{n2(b.qty)}</td>
              {canSeePnl && <td className="num">{n2(b.rate)}
                {!!(+b.comm) && <div className={"eyebrow "+(+b.comm>=0?"good":"bad")}
                  title={(+b.comm>=0?"commission receivable":"commission payable")}>
                  comm {+b.comm>=0?"+":"−"}{n2(Math.abs(+b.comm))}</div>}</td>}
              <td style={{fontWeight:400}}>{b.storage||"—"}</td>
              <td style={{fontWeight:400}} title={b.comments}>{(b.comments||"—").slice(0,20)}</td>
              <td colSpan={4} style={{fontWeight:400,color:"var(--mute)"}}>
                {sales.length? <>{sales.length+" sale"+(sales.length>1?"s":"")+" · "+n2(b.sold)+" t sold"}
                  {canSeePnl && <> · <span className={pnl(b)>=0?"good":"bad"}>{money(pnl(b))}</span></>}
                  {isOpen?"":" — tap to open"}</> : "no sale yet"}
                {canEdit && <button className="iconbtn" style={{marginLeft:8}} onClick={(e)=>{e.stopPropagation();onBatch(b);}}>e</button>}
              </td>
              {b.balance>0.001
                ? <td className="bal" style={{color:"#8A6D0B"}}>{n2(b.balance)} t</td>
                : canSeePnl
                  ? <td className="bal"><span className={pnl(b)>=0?"good":"bad"}>{money(pnl(b))}</span>
                      <div className="eyebrow">{commBatch(b)>0
                        ? "margin "+money(margin(b))+" + comm "+money(commBatch(b))
                        : (b.sold>0? "₹"+n2(pnl(b)/(b.sold*1000))+"/kg" : "closed")}</div></td>
                  : <td className="bal" style={{color:"var(--mute)"}}>0 t</td>}
            </tr>
            {isOpen && sales.map(s=>{ const m=s.rate-b.rate; return (
              <tr className="sale" key={s.id+b.id}>
                <td className="sticky ind">↳</td><td /><td colSpan={8} />
                <td className="mono">{dmy(s.date)}</td><td title={s.party}>{shortName(s.party)}</td>
                <td className="num">{n2(s.part)}</td>{canSeePnl && <td className="num">{n2(s.rate)}</td>}
                <td className="bal">
                  {canSeePnl && <span className={m>=0?"good":"bad"}>{m>=0?"+":"−"}{n2(Math.abs(m))}</span>}
                  {canSeePnl && !!(+s.comm) && <span className={+s.comm>=0?"good":"bad"}
                    title={(+s.comm>=0?"commission receivable ":"commission payable ")+"₹"+n2(Math.abs(+s.comm))+"/kg"}>
                    {"  comm "}{+s.comm>=0?"+":"−"}{n2(Math.abs(+s.comm))}</span>}
                  {canEdit && <button className="iconbtn" style={{marginLeft:6}} onClick={()=>onSale(s,b.id)}>e</button>}</td>
              </tr>); })}
          </Fragment>); })}
      </tbody>
    </table></div>
  </>);
}

function SaleEdit({s,fromId,bts,canEdit,onSave,onMove,onAttach,onDelete,onClose}){
  const here=(s.allocations||[]).find(a=>a.batchId===fromId);
  const [d,setD]=useState({...s}); const [part,setPart]=useState(here?String(here.qty):"");
  const [moving,setMoving]=useState(false);
  const batch=bts.find(b=>b.id===fromId);
  const others=bts.filter(b=>b.id!==fromId&&b.code===s.code);
  return (<>
    <h2>{canEdit?"Edit sale":"Sale"}</h2>
    <p className="hint" style={{marginBottom:12}}>
      {batch? "Booked against "+batch.batchNo+" · "+shortName(batch.party)+" @ ₹"+n2(batch.rate)+"/kg" : "Not tied to any batch"}
      {" · entered by "+(s.enteredBy||"—")}</p>
    {!moving && (<>
      <div className="row">
        <F label="Sale party" value={d.party} onChange={(v)=>setD({...d,party:v,buyer:v})} />
        <F label="Product" value={d.product} onChange={(v)=>setD({...d,product:v})} />
      </div>
      <div className="row" style={{marginTop:10}}>
        <F label="Date" type="date" value={d.date} onChange={(v)=>setD({...d,date:v})} />
        <F label="Total qty (ton)" value={d.qty} onChange={(v)=>setD({...d,qty:v})} />
        <F label="Rate ₹/kg" value={d.rate} onChange={(v)=>setD({...d,rate:v})} />
      </div>
      {batch && <div className="row" style={{marginTop:10}}>
        <F label={"Taken from "+batch.batchNo} value={part} onChange={setPart} /></div>}
      <div className="row" style={{marginTop:10}}>
        <F label="Commission ₹/kg" value={d.comm||""} onChange={(v)=>setD({...d,comm:v})} />
        <F label="Comments" value={d.comments||""} onChange={(v)=>setD({...d,comments:v})} /></div>
      {batch && <div className="kv" style={{marginTop:10}}><span>Margin on this batch</span>
        <b className={+d.rate-batch.rate>=0?"good":"bad"}>{+d.rate-batch.rate>=0?"+":"−"}₹{n2(Math.abs(+d.rate-batch.rate))}/kg</b></div>}
      {canEdit && <div style={{display:"flex",gap:8,marginTop:14,flexWrap:"wrap"}}>
        <button className="btn" onClick={()=>{
          const allocations=(d.allocations||[]).map(a=>a.batchId===fromId?{...a,qty:+part||0}:a).filter(a=>a.qty>0.0001);
          onSave({...d,qty:+d.qty||0,rate:+d.rate||0,comm:+d.comm||0,product:canonProduct(d.product),allocations});
        }}>Save</button>
        <button className="btn ghost" onClick={()=>setMoving(true)}>{fromId?"Wrong batch — move it":"Attach to a batch"}</button>
        <button className="btn ghost" onClick={onClose}>Close</button>
        <button className="btn danger" onClick={onDelete}>Delete</button>
      </div>}
      {!canEdit && <div style={{display:"flex",gap:8,marginTop:14}}>
        <button className="btn ghost" onClick={onClose}>Close</button></div>}
    </>)}
    {moving && (<>
      <p className="hint" style={{marginBottom:10}}>{fromId?"Move it into:":"Pick the batch it came out of:"}</p>
      {others.map(b=>(
        <button key={b.id} className="pick" onClick={()=>fromId?onMove(b.id):onAttach(b)}>
          <div className="g"><div className="no">{b.batchNo}</div><div className="nm">{shortName(b.party)}</div>
            <div className="eyebrow" style={{marginTop:2}}>{b.product} · {dmy(b.date)} · ₹{n2(b.rate)}/kg</div></div>
          <div className="q">{n2(b.balance)} t<i>balance</i></div></button>))}
      {others.length===0 && <p className="hint">No other batch in this book.</p>}
      <button className="btn ghost" style={{marginTop:12}} onClick={()=>setMoving(false)}>Back</button>
    </>)}
  </>);
}

function BatchEdit({b,canEdit,onSave,onDelete,onClose}){
  const [d,setD]=useState({...b});
  return (<>
    <h2>Batch {b.batchNo}</h2>
    <p className="hint" style={{marginBottom:10}}>Sold {n2(b.sold)} t · balance {n2(b.balance)} t · entered by {b.enteredBy||"—"}</p>
    <div className="row">
      <F label="Purchase party" value={d.party} onChange={(v)=>setD({...d,party:v,seller:v})} />
      <F label="Product" value={d.product} onChange={(v)=>setD({...d,product:v})} />
    </div>
    <div className="row" style={{marginTop:10}}>
      <F label="Qty (ton)" value={d.qty} onChange={(v)=>setD({...d,qty:+v||0})} />
      <F label="Rate ₹/kg" value={d.rate} onChange={(v)=>setD({...d,rate:+v||0})} />
      <F label="Port" value={d.port} onChange={(v)=>setD({...d,port:v})} />
    </div>
    <div className="row" style={{marginTop:10}}>
      <F label="Date" type="date" value={d.date} onChange={(v)=>setD({...d,date:v})} />
      <F label="Storage" value={d.storage} onChange={(v)=>setD({...d,storage:v})} />
    </div>
    <div className="row" style={{marginTop:10}}>
      <F label="Commission ₹/kg" value={d.comm||""} onChange={(v)=>setD({...d,comm:v})} />
      <F label="Comments" value={d.comments||""} onChange={(v)=>setD({...d,comments:v})} /></div>
    {canEdit
      ? <div style={{display:"flex",gap:8,marginTop:14,flexWrap:"wrap"}}>
          <button className="btn" onClick={()=>onSave({...d,comm:+d.comm||0,product:canonProduct(d.product),port:canonPort(d.port)||d.port})}>Save</button>
          <button className="btn ghost" onClick={onClose}>Close</button>
          <button className="btn danger" onClick={onDelete}>Delete batch</button></div>
      : <div style={{marginTop:14}}><button className="btn ghost" onClick={onClose}>Close</button></div>}
  </>);
}

function boot(){
  if(!window.FB){ setTimeout(boot,60); return; }
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
}
boot();
</script>
</body>
</html>
